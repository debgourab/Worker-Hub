<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard | Worker Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <meta name="author" content="Deb Gourab Biswas">
  <meta name="description" content="Worker Hub frontend demo: discover local services, compare worker profiles and manage booking requests.">
  <link rel="icon" href="assets/icons/logo.png" type="image/png">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <nav class="nav container" aria-label="Primary navigation">
      <a class="brand" href="index.html"><img src="assets/icons/logo.png" alt="" class="brand-icon"><span>Worker</span><span class="deb">Hub</span></a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
      <div class="nav-links" data-nav-links>
        <a href="workers.html">Find Workers</a>
        <a class="active" aria-current="page" href="customer-dashboard.html">Customer Dashboard</a>
        <a href="worker-dashboard.html">Worker Dashboard</a>
      </div>
    </nav>
  </header>
  <main id="main-content" tabindex="-1" class="page dashboard container">
    <section class="dashboard-head">
      <div><p class="eyebrow">Customer workspace</p><h1>Your bookings</h1></div>
      <a class="btn" href="workers.html">Book Another Worker</a>
    </section>
    <p class="muted">Sample metrics for presentation; these do not reflect saved requests.</p>
    <section class="metrics" aria-label="Illustrative demo metrics">
      <div><strong>3</strong><span>Active requests</span></div>
      <div><strong>12</strong><span>Completed jobs</span></div>
      <div><strong>4.8</strong><span>Average rating given</span></div>
    </section>
    <section class="dashboard-grid">
      <div class="panel"><h2>Current requests</h2><div id="customer-bookings"></div></div>
      <div class="panel"><h2>Recommended workers</h2><div id="recommended-workers"></div></div>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/data.js"></script>
  <script src="js/safe-html.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
